<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Saudi Econ Coffee Seminar Series</title>
  <style>
    /* Basic Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }

    /* Banner Section */
    .banner {
      width: 100%;
      height: 300px;
      background: url("baner.jpg") center center/cover no-repeat;
      position: relative; /* so we can position the overlay absolutely */
      margin-bottom: 2rem;
    }
    .banner h1 {
      color: #fff; 
      background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black behind the text */
      padding: 1rem 2rem;                   /* Adds some spacing around the text */
      border-radius: 8px;                   /* Rounds the corners of the background box */
      font-size: 2rem;                      /* Adjust as needed */
      font-weight: 600;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6); /* Soft shadow to boost visibility */
    }
    
    /* Container for main content */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* Short Description */
    .intro {
      margin-bottom: 2rem;
    }
    .intro p {
      margin: 1rem 0;
    }

    /* Table Styling */
    .seminar-table {
      width: 100%;
      border-collapse: collapse;
    }
    .seminar-table thead tr {
      background-color: #f5f5f5;
    }
    .seminar-table th, .seminar-table td {
      border: 1px solid #ccc;
      padding: 0.75rem;
      text-align: left;
      vertical-align: middle;
    }
    .seminar-table th {
      font-weight: bold;
    }
    .seminar-table td a {
      color: #0066cc;
      text-decoration: none;
    }
    .seminar-table td a:hover {
      text-decoration: underline;
    }

    /* Icon link styling (optional) */
    .icon-link img {
      height: 24px; /* Adjust icon size here */
      vertical-align: middle;
    }

    /* Footer (optional) */
    footer {
      margin: 2rem 0;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .banner h1 {
        font-size: 1.5rem;
      }
      .seminar-table th, .seminar-table td {
        font-size: 0.9rem;
        padding: 0.5rem;
      }
    }

  </style>
</head>
<body>

  <div class="banner">
    <h1>Saudi Econ Coffee Seminar Series</h1>
  </div>

  <div class="container">
    
    <h2 style="margin-bottom: 1rem;">Seminar Series hosted by KAPSARC</h2>
    <p>
      Welcome to the <strong>Saudi Econ Coffee Seminar Series</strong>—a forum for passionate economists and researchers
